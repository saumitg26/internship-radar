name: Refresh internship listings and publish site
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */4 * * *' # Every 4 hours in UTC; GitHub may delay scheduled executions.
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  refresh-and-publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test employer description extraction and accepted resume exports
        run: |
          python scripts/test_job_descriptions.py
          node scripts/test_resume_edits.cjs
          node scripts/test_application_pipeline.cjs
          node scripts/test_daily_progress.cjs
          node scripts/test_insights.cjs
          node scripts/test_navigation.cjs
      - name: Sync public listings (handles unavailable boards gracefully)
        run: python scripts/sync_jobs.py
      - name: Stamp asset versions to bypass stale browser caches
        run: python scripts/stamp_assets.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
