name: Refresh internship listings and publish site
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 12,17,21 * * *' # Approx. 8:17 AM, 1:17 PM, 5:17 PM EDT (UTC schedule); GitHub can delay runs.
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  refresh-and-publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync public listings (handles unavailable boards gracefully)
        run: python scripts/sync_jobs.py
      - name: Stamp asset versions to bypass stale browser caches
        run: python scripts/stamp_assets.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
